<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your quotation</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app" style="max-width:720px">Loading…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(async () => {
  const app = document.getElementById('app'), tok = new URLSearchParams(location.search).get('t') || '';
  const el = (tag, txt, cls, style) => { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; if (style) e.setAttribute('style', style); return e; };
  const add = (p, ...k) => { k.flat().forEach(x => x != null && p.append(x.nodeType ? x : document.createTextNode(x))); return p; };
  const SYM = { NGN: '₦', USD: '$', GBP: '£', EUR: '€' };
  const money = (n, c) => (SYM[c] || (c || '') + ' ') + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const msg = (t, cls) => { app.textContent = ''; app.append(add(el('div', null, 'card ' + (cls || '')), el('p', t))); };
  try {
    const sb = supabase.createClient(new URL(String(IKETECH.SUPABASE_URL).trim().replace(/^["']|["']$/g, '')).origin, String(IKETECH.SUPABASE_ANON_KEY).trim());
    const { data: q } = await sb.rpc('public_quotation', { p_token: tok });
    if (!q) return msg('This link is not valid. Please ask the workshop to send it again.', 'err');
    const co = q.company || {};
    const render = (done) => {
      app.textContent = '';
      const hd = el('div', null, 'card', 'display:flex;gap:12px;align-items:center;border-top:5px solid #0f766e'), logo = el('img'); logo.src = 'logo.jpg'; logo.setAttribute('style', 'width:70px;border-radius:6px');
      add(hd, logo, add(el('div'), el('b', co.company_name || 'IKETECH AUTO LTD', null, 'font-size:18px;color:#0f766e'), el('div', co.motto || '', 'mut', 'font-style:italic;color:#0f766e')));
      app.append(hd);
      const c = el('div', null, 'card'); add(c, el('h2', 'Quotation ' + q.number, null, 'color:#0f766e'), el('div', 'Hello ' + (q.customer || '') + ', here is the quotation for your ' + q.vehicle + '.', 'mut'));
      if (q.complaint) c.append(add(el('div', null, null, 'margin-top:10px'), el('b', 'Your complaint: ', null, 'color:#0f766e'), q.complaint));
      if (q.diagnosis) c.append(add(el('div', null, null, 'margin-top:8px'), el('b', 'Diagnosis (confirmed by test): ', null, 'color:#0f766e'), q.diagnosis));
      const rl = (q.repairs || []).map(r => r.item + (r.action ? ' – ' + r.action : '')); if (q.recommended_solution) rl.unshift(q.recommended_solution);
      if (rl.length) { const ul = el('ul', null, null, 'margin:4px 0 0 18px;padding:0'); rl.forEach(x => ul.append(el('li', x))); c.append(add(el('div', null, null, 'margin-top:8px'), el('b', 'Recommended repair:', null, 'color:#0f766e')), ul); }
      c.append(add(el('div', null, null, 'display:flex;justify-content:space-between;background:#0f766e;color:#fff;padding:7px 10px;border-radius:6px;margin-top:10px;font-size:13px;font-weight:bold'), el('span', 'Description'), el('span', 'Amount')));
      q.lines.forEach(l => c.append(add(el('div', null, 'row'), add(el('span'), el('b', l.description), el('div', l.type + ' · ' + l.qty + ' × ' + money(l.unit_price, q.currency), 'mut')), el('span', money(l.qty * l.unit_price, q.currency)))));
      c.append(add(el('div', null, 'row', 'border-top:2px solid #0f766e'), el('b', 'Total', null, 'color:#0f766e'), el('b', money(q.total, q.currency), null, 'color:#0f766e')));
      if (q.currency === 'USD' && q.fx_rate) c.append(el('div', 'Exchange rate ₦' + Number(q.fx_rate).toLocaleString() + ' per $1. Naira equivalent ₦' + (q.total * q.fx_rate).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }), 'mut'));
      if (q.valid_until) c.append(el('div', 'Valid until ' + q.valid_until, 'mut'));
      app.append(c);
      const terms = (co.terms || '').split('\n').filter(x => x.trim());
      if (terms.length) { const t = el('div', null, 'card', 'font-size:13px'); t.append(el('b', 'TERMS AND CONDITIONS', null, 'color:#0f766e')); terms.forEach((x, i) => t.append(el('div', (i + 1) + '. ' + x, 'mut'))); app.append(t); }
      const act = el('div', null, 'card');
      if (done) act.append(el('p', done, 'okm'));
      else if (q.status === 'APPROVED') act.append(el('p', 'You approved this quotation. Thank you. The workshop will begin the work.', 'okm'));
      else if (q.status === 'REJECTED') act.append(el('p', 'This quotation was declined. Contact the workshop if you would like to change your mind.'));
      else if (q.status !== 'SENT') act.append(el('p', 'This quotation is not open for approval. Please contact the workshop.'));
      else if (q.expired) act.append(el('p', 'This quotation has expired. Please contact the workshop for an updated one.', 'err'));
      else {
        const agree = el('input'); agree.type = 'checkbox'; const note = el('textarea'); note.rows = 2; note.placeholder = 'Optional note, or your reason if you decline'; const out = el('div');
        const go = d => async () => { out.textContent = ''; if (d === 'approve' && !agree.checked) return out.append(el('p', 'Please tick the box to confirm you have read the terms.', 'err'));
          const { error } = await sb.rpc('public_quotation_decide', { p_token: tok, p_decision: d, p_note: note.value.trim() || null });
          if (error) return out.append(el('p', error.message, 'err')); q.status = d === 'approve' ? 'APPROVED' : 'REJECTED'; render(d === 'approve' ? 'Thank you. Your approval has been recorded and the workshop has been notified.' : 'Your decision has been recorded. The workshop has been notified.'); };
        const a = el('button', 'Approve quotation', 'p', 'background:#0f766e'), b = el('button', 'Decline', 'p', 'background:#667085;margin-left:8px'); a.onclick = go('approve'); b.onclick = go('decline');
        add(act, add(el('label'), agree, ' I have read and accept the terms and conditions'), el('label', 'Note (optional)'), note, a, b, out);
      }
      app.append(act);
    };
    render();
  } catch (e) { msg('Could not load this page. Please try again.', 'err'); }
})();
</script></body></html>
